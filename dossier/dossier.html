<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Role OS — Crew Dossier</title>
<style>
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono","Consolas",monospace;
  --bg-0:#070e1a;--bg-1:#0a1422;
  --bg-grad:radial-gradient(1200px 700px at 78% -10%,#14304d 0%,rgba(20,48,77,0) 55%),linear-gradient(180deg,#0b1626 0%,#070e1a 100%);
  --panel:rgba(17,30,50,.72);--panel-2:rgba(12,22,38,.8);--panel-solid:#111e32;
  --hair:rgba(150,180,220,.12);--hair-strong:rgba(150,180,220,.22);
  --ink:#e7eef7;--ink-dim:#9fb2c9;--ink-faint:#6c8099;
  --accent:#34e0a1;--accent-dim:rgba(52,224,161,.16);--cyan:#4fc3f7;--cyan-dim:rgba(79,195,247,.16);
  --warn:#f5b544;--warn-dim:rgba(245,181,68,.16);--andon:#ff5d5d;--andon-dim:rgba(255,93,93,.14);
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);--radius:12px;
}
[data-theme="light"]{
  --bg-1:#e6ecf3;--bg-grad:radial-gradient(1100px 650px at 80% -12%,#d4e4f3 0%,rgba(212,228,243,0) 55%),linear-gradient(180deg,#f3f6fa 0%,#e6ecf3 100%);
  --panel:rgba(255,255,255,.86);--panel-2:rgba(248,251,255,.92);--panel-solid:#fff;
  --hair:rgba(15,27,45,.12);--hair-strong:rgba(15,27,45,.2);--ink:#0f1b2d;--ink-dim:#44586f;--ink-faint:#7488a0;
  --accent:#0f9d6c;--accent-dim:rgba(15,157,108,.14);--cyan:#1f7fb8;--cyan-dim:rgba(31,127,184,.12);
  --warn:#b9791a;--warn-dim:rgba(185,121,26,.14);--andon:#d83a3a;--andon-dim:rgba(216,58,58,.1);--shadow:0 16px 40px -22px rgba(15,27,45,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);color:var(--ink);background:var(--bg-1);background-image:var(--bg-grad);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;min-height:100vh}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}

.classbar{display:flex;align-items:center;gap:12px;padding:9px 22px;border-bottom:1px solid var(--hair);background:var(--panel-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);position:sticky;top:0;z-index:20;backdrop-filter:blur(6px)}
.classbar .mark{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.classbar b{color:var(--ink-dim);font-weight:600}
.classbar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.theme-btn{border:1px solid var(--hair-strong);background:var(--panel);color:var(--ink-dim);border-radius:8px;padding:4px 9px;font-size:11px;text-transform:none;letter-spacing:0}

/* gallery */
.gallery{max-width:1120px;margin:0 auto;padding:22px 18px 60px}
.lead{color:var(--ink-dim);font-size:13px;margin:4px 2px 20px}
.crew-sec{margin-bottom:26px}
.crew-h{display:flex;align-items:center;gap:9px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim);margin:0 0 12px}
.crew-h .swatch{width:10px;height:10px;border-radius:3px}
.crew-h .count{color:var(--ink-faint)}
.crew-h::after{content:'';flex:1;height:1px;background:var(--hair)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:14px}
.tile{border:1px solid var(--hair);border-left:3px solid var(--crew,#9fb2c9);border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer;text-align:left;padding:0;color:inherit;transition:transform .12s,border-color .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--hair-strong);box-shadow:var(--shadow)}
.tile .thumb{width:100%;aspect-ratio:5/6;object-fit:cover;object-position:center top;display:block;background:var(--panel-2)}
.tile .thumb.ph{display:grid;place-items:center;color:var(--ink-faint);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.tile .tinfo{padding:9px 11px}
.tile .tname{font-weight:600;font-size:13px;line-height:1.2}
.tile .tfn{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
.tile .trow{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:6px}
.tile .tdisp{font-size:10.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:2px;flex:0 0 auto}
.pip{width:7px;height:4px;border-radius:2px;background:var(--bg-1);border:1px solid var(--hair)}
.pip.on{background:var(--crew,#9fb2c9);border-color:transparent}

/* detail */
.backbar{max-width:880px;margin:16px auto 0;padding:0 18px}
.back-btn{border:1px solid var(--hair-strong);background:var(--panel);color:var(--ink-dim);border-radius:8px;padding:7px 13px;font-size:12px}
.back-btn:hover{color:var(--ink)}
.wrap{max-width:880px;margin:14px auto 60px;padding:0 18px}
.dossier{border:1px solid var(--hair-strong);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dossier.anim{animation:slideIn .2s ease}
.section{padding:20px 24px;border-top:1px solid var(--hair)}
.section:first-child{border-top:none}
.section-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.section-h::after{content:'';flex:1;height:1px;background:var(--hair)}
.head{display:flex;gap:20px;align-items:stretch}
.portrait{flex:0 0 190px;width:190px;height:236px;border-radius:12px;position:relative;background:linear-gradient(180deg,var(--crew-dim,rgba(150,180,220,.12)),var(--panel-2));border:2px solid var(--crew,var(--cyan));box-shadow:0 0 0 1px var(--hair),0 0 26px -10px var(--crew,var(--cyan));overflow:hidden}
.portrait .pface{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.portrait .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-faint);font-size:11px}
.portrait .gstamp{position:absolute;top:7px;right:7px;font-family:var(--font-mono);font-size:11px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:1px 6px;background:rgba(7,14,26,.55);z-index:2}
.idblock{flex:1;min-width:0;display:flex;flex-direction:column}
.role-name{font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.role-spec{color:var(--ink-dim);font-size:13.5px;margin-top:3px}
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--hair-strong);color:var(--ink-dim);display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.fn{color:var(--ink);border-color:var(--cyan);background:var(--cyan-dim)}
.gauges{display:flex;gap:14px;margin-top:auto;padding-top:16px}
.gauge{flex:1;border:1px solid var(--hair);border-radius:10px;background:var(--panel-2);padding:11px 13px}
.gauge-k{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)}
.gauge-v{font-family:var(--font-mono);font-size:21px;font-weight:700;margin-top:2px}
.gauge-v small{font-size:11px;color:var(--ink-dim);font-weight:400}
.gauge.ok .gauge-v{color:var(--accent)}
.grade-path{display:flex;gap:4px;margin-top:7px}
.gp{flex:1;height:5px;border-radius:3px;background:var(--bg-1);border:1px solid var(--hair)}
.gp.on{background:var(--crew,var(--cyan));border-color:transparent}
.cal-meter{height:6px;border-radius:4px;background:var(--bg-1);border:1px solid var(--hair);margin-top:8px;overflow:hidden}
.cal-fill{height:100%;background:var(--accent);border-radius:4px}
.apt-grid{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:center}
@media (max-width:680px){.apt-grid{grid-template-columns:1fr}.head{flex-direction:column}.portrait{width:100%;height:300px;flex:none}}
.radar{width:300px;height:300px;margin:auto;display:block}
.radar .ring{fill:none;stroke:var(--hair);stroke-width:1}
.radar .axis{stroke:var(--hair-strong);stroke-width:1}
.radar .ideal{fill:none;stroke:var(--ink-faint);stroke-width:1.5;stroke-dasharray:4 3;opacity:.8}
.radar .cur{fill:var(--accent-dim);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar .cur-dot{fill:var(--accent)}
.radar .lbl{fill:var(--ink-dim);font:600 11px var(--font-ui)}
.radar .lblv{fill:var(--ink-faint);font:11px var(--font-mono)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:90px 1fr 26px;gap:10px;align-items:center}
.bar-k{font-size:12px;color:var(--ink)}
.bar-track{position:relative;height:9px;border-radius:6px;background:var(--bg-1);border:1px solid var(--hair);overflow:visible}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--accent)}
.bar-ideal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.bar-v{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);text-align:right}
.legend{display:flex;gap:16px;margin-top:14px;font-size:11px;color:var(--ink-faint)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lz{width:14px;height:3px;border-radius:2px;background:var(--accent)}
.lz.id{background:none;border-top:2px dashed var(--ink-faint);height:0}
.maps{margin-top:16px;border:1px dashed var(--hair-strong);border-radius:10px;padding:12px 14px;background:var(--panel-2)}
.maps .mh{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan);margin-bottom:8px}
.maps dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:12px}
.maps dt{color:var(--ink);font-weight:600;white-space:nowrap}
.maps dd{margin:0;color:var(--ink-dim)}
.pending{border:1px dashed var(--hair-strong);border-radius:10px;padding:18px;background:var(--panel-2);color:var(--ink-faint);font-size:12.5px;text-align:center}
.disp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.disp-name{font-size:16px;font-weight:700;color:var(--crew,var(--cyan))}
.disp-blurb{color:var(--ink-dim);font-size:12.5px}
.voice{margin-top:12px;padding:12px 16px;border-left:3px solid var(--crew,var(--cyan));background:var(--panel-2);border-radius:0 8px 8px 0;font-size:13.5px;font-style:italic;color:var(--ink)}
.pdelta{margin-top:12px;border:1px solid var(--warn-dim);background:var(--warn-dim);border-radius:10px;padding:11px 14px}
.pdelta .ph{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--warn);font-weight:700;display:flex;gap:8px;align-items:center}
.pdelta .d{font-family:var(--font-mono);color:var(--ink)}
.pdelta p{margin:7px 0 0;font-size:12.5px;color:var(--ink)}
.lo-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pin{font-family:var(--font-mono);font-size:11.5px;padding:5px 11px;border-radius:8px;border:1px solid var(--cyan);background:var(--cyan-dim);color:var(--ink)}
.tool{font-family:var(--font-mono);font-size:11px;padding:4px 9px;border-radius:7px;border:1px solid var(--hair-strong);color:var(--ink-dim)}
.tool .acc{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;margin-left:6px}
.tool.read .acc{color:var(--cyan)}.tool.write .acc{color:var(--accent)}
.moves{display:flex;flex-direction:column;gap:9px}
.move{display:flex;gap:11px;align-items:flex-start}
.move .mi{flex:0 0 auto;width:18px;height:18px;border-radius:5px;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;font-size:12px;margin-top:1px}
.move b{font-size:13px}.move .md{color:var(--ink-dim);font-size:12.5px}
.move .earn{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--crew,var(--cyan));border:1px solid var(--hair-strong);border-radius:4px;padding:1px 5px;margin-left:6px}
.charter{font-size:14px;line-height:1.55;color:var(--ink)}
.guards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.guards li{display:flex;gap:9px;font-size:12px;color:var(--ink-dim)}
.guards li .g{color:var(--warn);flex:0 0 auto}
.foot{padding:14px 24px;border-top:1px solid var(--hair);font-size:11px;color:var(--ink-faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
  <div class="classbar">
    <span class="mark"></span><b>Role OS</b> · Crew Dossier
    <span class="right"><button class="theme-btn" id="themeBtn">◐ theme</button></span>
  </div>
  <div id="app"></div>

  <script src="data.js"></script>
  <script>
  const $app = document.getElementById('app');
  const GRADES = ['L0','L1','L2','L3','L4','L5'];
  const AXES = ['rigor','pace','range','skepticism','autonomy','candor'];
  const LABEL = {rigor:'Rigor',pace:'Pace',range:'Range',skepticism:'Skepticism',autonomy:'Autonomy',candor:'Candor'};
  const CREW_ORDER = ['core','product','engineering','design','research','growth','marketing','treatment','deep-audit','brainstorm','swarm'];
  const CREW_LABEL = {core:'Core',product:'Product',engineering:'Engineering',design:'Design',research:'Research',growth:'Growth',marketing:'Marketing',treatment:'Treatment','deep-audit':'Deep Audit',brainstorm:'Brainstorm',swarm:'Swarm'};
  const ROSTER = window.ROSTER||{}, DOSSIERS = window.DOSSIERS||{}, HOUSE = window.HOUSE||{}, PALETTE = window.PALETTE||{};
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const color = crew => PALETTE[crew] || '#9fb2c9';
  const pips = (level) => { const i = GRADES.indexOf(level); return GRADES.map((g,k)=>`<span class="pip ${k<=i?'on':''}" title="${g}"></span>`).join(''); };

  function renderGallery(){
    const byCrew = {};
    for(const r of Object.values(ROSTER)){ (byCrew[r.crew]=byCrew[r.crew]||[]).push(r); }
    const total = Object.keys(ROSTER).length;
    let h = `<div class="gallery"><div class="lead">The crew — <b>${total} roles</b>, fully statted. Click any operative to open their dossier. Painted by Chroma1-HD.</div>`;
    for(const crew of CREW_ORDER){
      const list = (byCrew[crew]||[]).slice().sort((a,b)=>a.role.localeCompare(b.role));
      if(!list.length) continue;
      const c = color(crew);
      h += `<section class="crew-sec"><div class="crew-h"><span class="swatch" style="background:${c}"></span>${CREW_LABEL[crew]||crew}<span class="count">· ${list.length}</span></div><div class="grid">`;
      for(const r of list){
        const thumb = r.portrait ? `<img class="thumb" src="${r.portrait}" alt="${esc(r.role)}" loading="lazy">` : `<div class="thumb ph">portrait pending</div>`;
        h += `<button class="tile" style="--crew:${c}" onclick="showDetail('${r.id}')">${thumb}<div class="tinfo"><div class="tname">${esc(r.role)}</div><div class="tfn">${esc(r.function)}</div><div class="trow"><span class="tdisp">${esc(r.disposition)}</span><span class="pips">${pips(r.grade)}</span></div></div></button>`;
      }
      h += `</div></section>`;
    }
    h += `</div>`;
    $app.innerHTML = h; window.scrollTo(0,0);
  }

  function calibration(apt, ideal){ const dev = AXES.reduce((s,k)=>s+Math.abs((apt[k]??0)-(ideal[k]??0)),0); return Math.max(0,Math.round(100-dev*7)); }
  function radarSVG(apt, ideal){
    const W=300,H=300,cx=W/2,cy=H/2,R=92,n=AXES.length;
    const ang=i=>-Math.PI/2+i*2*Math.PI/n, pt=(i,v)=>[cx+Math.cos(ang(i))*(v/5)*R,cy+Math.sin(ang(i))*(v/5)*R];
    const poly=o=>AXES.map((k,i)=>pt(i,o[k]??0).map(x=>x.toFixed(1)).join(',')).join(' ');
    let rings='';for(let r=1;r<=5;r++){rings+=`<polygon class="ring" points="${AXES.map((_,i)=>pt(i,r).map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`;}
    let axes='',labels='',dots='';
    AXES.forEach((k,i)=>{const[ex,ey]=pt(i,5);axes+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"/>`;
      const[lx,ly]=pt(i,5.9),anchor=Math.abs(lx-cx)<6?'middle':(lx>cx?'start':'end');
      labels+=`<text class="lbl" x="${lx.toFixed(1)}" y="${(ly+(ly<cy?-2:10)).toFixed(1)}" text-anchor="${anchor}">${LABEL[k]}</text>`;
      labels+=`<text class="lblv" x="${lx.toFixed(1)}" y="${(ly+(ly<cy?10:22)).toFixed(1)}" text-anchor="${anchor}">${apt[k]??0}/5</text>`;
      const[dx,dy]=pt(i,apt[k]??0);dots+=`<circle class="cur-dot" cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="3"/>`;});
    return `<svg class="radar" viewBox="0 0 ${W} ${H}">${rings}${axes}<polygon class="ideal" points="${poly(ideal)}"/><polygon class="cur" points="${poly(apt)}"/>${dots}${labels}</svg>`;
  }

  function headHTML(name, spec, fn, crew, portrait, gradeLevel, extraGauge){
    const c = color(crew);
    const face = portrait ? `<img class="pface" src="${portrait}" alt="${esc(name)}">` : `<div class="ph">portrait pending</div>`;
    return `<div class="head"><div class="portrait" style="--crew:${c}"><span class="gstamp">${esc(gradeLevel)}</span>${face}</div>
      <div class="idblock"><div class="role-name">${esc(name)}</div><div class="role-spec">${esc(spec)}</div>
      <div class="chiprow"><span class="chip fn">${esc(fn)}</span><span class="chip"><span class="dot" style="background:${c}"></span>${esc(CREW_LABEL[crew]||crew)}</span></div>
      <div class="gauges"><div class="gauge"><div class="gauge-k">Grade</div><div class="gauge-v">${esc(gradeLevel)}</div><div class="grade-path" style="--crew:${c}">${GRADES.map((g,k)=>`<div class="gp ${k<=GRADES.indexOf(gradeLevel)?'on':''}"></div>`).join('')}</div></div>${extraGauge||''}</div></div></div>`;
  }

  function fullCardHTML(d, r){
    const c = color(r.crew); const cal = calibration(d.aptitudes, d.ideal);
    const calGauge = `<div class="gauge ${cal>=85?'ok':''}"><div class="gauge-k">Calibration · vs canon</div><div class="gauge-v">${cal}<small>/100</small></div><div class="cal-meter"><div class="cal-fill" style="width:${cal}%"></div></div></div>`;
    const bars = AXES.map(k=>{const v=d.aptitudes[k]??0,id=d.ideal[k]??0;return `<div class="bar-row"><span class="bar-k">${LABEL[k]}</span><div class="bar-track"><div class="bar-fill" style="width:${v/5*100}%"></div><div class="bar-ideal" style="left:${id/5*100}%"></div></div><span class="bar-v">${v}/5</span></div>`;}).join('');
    const maps = AXES.map(k=>`<dt>${LABEL[k]}</dt><dd>${esc(d.maps_to&&d.maps_to[k]||'')}</dd>`).join('');
    const tools = (d.loadout?.tools||[]).map(t=>`<span class="tool ${t.access}">${esc(t.name)}<span class="acc">${t.access}</span></span>`).join('');
    const moves = (d.signatureMoves||[]).map(m=>`<div class="move"><span class="mi">◆</span><div><b>${esc(m.name)}</b>${m.earned?`<span class="earn">via ${esc(m.earned)}</span>`:''}<div class="md">${esc(m.desc)}</div></div></div>`).join('');
    const guards = (d.guards||[]).map(g=>`<li><span class="g">▲</span>${esc(g)}</li>`).join('');
    const deltaStr = Object.entries(d.disposition?.delta||{}).map(([k,v])=>`${LABEL[k]||k} ${v}`).join(' · ');
    let h = headHTML(d.role, d.specialization, d.function, r.crew, r.portrait, d.grade.level, calGauge)
      + `<div class="section"><div class="section-h">Aptitudes</div><div class="apt-grid">${radarSVG(d.aptitudes,d.ideal)}<div><div class="bars">${bars}</div><div class="legend"><span><span class="lz"></span> current build</span><span><span class="lz id"></span> canonical ideal</span></div></div></div><div class="maps"><div class="mh">What these numbers do</div><dl>${maps}</dl></div></div>`
      + `<div class="section"><div class="section-h">Disposition</div><div class="disp-top"><span class="disp-name" style="--crew:${c}">${esc(d.disposition.active)}</span><span class="disp-blurb">${esc(d.disposition.blurb)}</span></div><div class="voice" style="--crew:${c}">“${esc(d.disposition.voice)}”</div><div class="pdelta"><div class="ph">Behavioral delta <span class="d mono">${esc(deltaStr)}</span></div><p>${esc(d.disposition.prompt_delta)}</p></div></div>`;
    if (d.loadout?.model) h += `<div class="section"><div class="section-h">Loadout</div><div class="lo-row"><span class="pin">${esc(d.loadout.model.pin)} · ${d.loadout.model.maxTurns} turns · $${Number(d.loadout.model.budgetUsd).toFixed(0)} ceiling</span>${tools}</div></div>`;
    if ((d.signatureMoves||[]).length) h += `<div class="section"><div class="section-h">Signature Moves</div><div class="moves">${moves}</div></div>`;
    h += `<div class="section"><div class="section-h">Charter</div><div class="charter">${esc(d.charter)}</div></div>`;
    if ((d.guards||[]).length) h += `<div class="section"><div class="section-h">Guards</div><ul class="guards">${guards}</ul></div>`;
    h += `<div class="foot"><span class="mono">${esc(d.schema||'roleos-dossier/v0.1')}</span><span>painted portrait · Chroma1-HD</span></div>`;
    return h;
  }

  function identityCardHTML(r){
    const c = color(r.crew);
    const expr = (HOUSE.disposition_expression||{})[r.disposition];
    return headHTML(r.role, r.specialization, r.function, r.crew, r.portrait, r.grade)
      + `<div class="section"><div class="section-h">Aptitudes</div><div class="pending">Aptitude profile pending — this role has no dossier entry yet (all 64 roster roles ship statted; this is a fallback for newly added roles).<br>Disposition default: <b style="color:${c}">${esc(r.disposition)}</b>${expr?` — <span class="muted">${esc(expr)}</span>`:''}</div></div>`
      + `<div class="section"><div class="section-h">Charter</div><div class="charter">${esc(r.charter)}</div></div>`
      + `<div class="foot"><span class="mono">roleos-dossier/v0.1 · identity</span><span>painted portrait · Chroma1-HD</span></div>`;
  }

  function showDetail(id){
    const r = ROSTER[id]; if(!r) return;
    const inner = DOSSIERS[id] ? fullCardHTML(DOSSIERS[id], r) : identityCardHTML(r);
    $app.innerHTML = `<div class="backbar"><button class="back-btn" onclick="renderGallery()">← the crew</button></div><div class="wrap"><div class="dossier anim">${inner}</div></div>`;
    window.scrollTo(0,0);
  }
  window.showDetail = showDetail; window.renderGallery = renderGallery;

  document.getElementById('themeBtn').addEventListener('click',()=>{const h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');});
  renderGallery();
  </script>
</body>
</html>
