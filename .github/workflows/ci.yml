name: CI

on:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "bin/**"
      - "src/**"
      - "test/**"
      - "starter-pack/**"
      - "tools/**"
      - ".claude/role-os/**"
      - ".github/workflows/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      - "atlas/**"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "bin/**"
      - "src/**"
      - "test/**"
      - "starter-pack/**"
      - "tools/**"
      - ".claude/role-os/**"
      - ".github/workflows/**"
      - "site/package.json"
      - "site/package-lock.json"
      - "site/astro.config.mjs"
      - "atlas/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      # Atlas requires Node 22 or later, so the check runs on the 22 cell only.
      - name: Atlas check
        if: matrix.node-version == 22
        run: npx --yes @dogfood-lab/atlas@1.20.0 check
      - run: npm ci
      - run: npm test
      - run: npm run verify
