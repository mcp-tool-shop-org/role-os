name: Release

# Publish to npm via Trusted Publishing (OIDC) when a GitHub release is published.
# No long-lived NODE_AUTH_TOKEN — the npm Trusted Publisher for mcp-tool-shop-org/role-os is
# configured against this workflow (release.yml); npm CLI >= 11.5 performs the OIDC exchange.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an OIDC-capable npm (Trusted Publishing needs npm >= 11.5)
        # Pinned exact version on the publish path — bump deliberately, never float @latest
        # with Trusted Publishing rights.
        run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm test
      - name: Pack (dry-run)
        if: github.event_name != 'release'
        run: npm pack --dry-run
      - name: Assert package.json version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi
      - name: Publish to npm via Trusted Publishing (OIDC)
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
